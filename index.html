<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资产管理</title>
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%E4%B8%AA%E4%BA%BA%E8%B5%84%E4%BA%A7%E7%AE%A1%E7%90%86%22%2C%22short_name%22%3A%22%E8%B5%84%E4%BA%A7%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22theme_color%22%3A%22%233B82F6%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22icons%22%3A%5B%5D%7D">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"
        onerror="if(!this.dataset.r){this.dataset.r='1';this.src='https://cdn.bootcdn.net/ajax/libs/Chart.js/4.4.1/chart.umd.min.js';}">
    </script>
    <script src="https://cdn.tailwindcss.com"
        onerror="var l=document.createElement('link');l.rel='stylesheet';l.href='https://cdn.bootcdn.net/ajax/libs/tailwindcss/2.2.19/tailwind.min.css';document.head.appendChild(l);this.remove();">
    </script>
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .tab-btn {
            transition: all 0.3s ease;
            border-radius: 8px 8px 0 0;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%);
            color: white !important;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            transform: translateY(-2px);
        }
        .tab-btn:hover:not(.active) {
            background-color: #f0f5ff;
            color: #3B82F6;
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        @media (max-width: 768px) {
            .responsive-table thead { display: none; }
            .responsive-table tr {
                display: block;
                margin-bottom: 0.75rem;
                border: 1px solid #e5e7eb;
                border-radius: 0.75rem;
                padding: 0.75rem;
                background: white;
            }
            .responsive-table td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0.375rem 0;
                border-bottom: 1px solid #f3f4f6;
                text-align: right;
                font-size: 0.8125rem;
            }
            .responsive-table td:last-child { border-bottom: none; }
            .responsive-table td::before {
                content: attr(data-label);
                font-weight: 600;
                color: #6b7280;
                font-size: 0.75rem;
                text-align: left;
                flex-shrink: 0;
                margin-right: 0.75rem;
            }
            .responsive-table tr.bg-gray-50 td::before { color: #4b5563; }
            .responsive-table .col-secondary { display: none !important; }
            input, select, textarea { font-size: 16px !important; }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-3 sm:px-4 py-3 sm:py-4">
            <h1 class="text-lg sm:text-xl font-bold text-gray-800">💰 个人资产管理</h1>
        </div>
    </header>

    <nav class="bg-white border-b">
        <div class="max-w-6xl mx-auto px-2 sm:px-4">
            <div class="flex space-x-2 overflow-x-auto scrollbar-hide -webkit-overflow-scrolling-touch">
                <button class="tab-btn active flex-shrink-0 whitespace-nowrap px-3 sm:px-5 py-2.5 sm:py-3 text-xs sm:text-sm font-medium text-white bg-gradient-to-r from-blue-500 to-blue-600 rounded-t-lg shadow-md" data-tab="dashboard">
                    <span class="flex items-center">
                        <span class="mr-1.5 sm:mr-2 text-base sm:text-lg">📊</span>
                        <span>仪表盘</span>
                    </span>
                </button>
                <button class="tab-btn flex-shrink-0 whitespace-nowrap px-3 sm:px-5 py-2.5 sm:py-3 text-xs sm:text-sm font-medium text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-t-lg" data-tab="assets">
                    <span class="flex items-center">
                        <span class="mr-1.5 sm:mr-2 text-base sm:text-lg">📦</span>
                        <span>资产管理</span>
                    </span>
                </button>
                <button class="tab-btn flex-shrink-0 whitespace-nowrap px-3 sm:px-5 py-2.5 sm:py-3 text-xs sm:text-sm font-medium text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-t-lg" data-tab="expiry">
                    <span class="flex items-center">
                        <span class="mr-1.5 sm:mr-2 text-base sm:text-lg">📅</span>
                        <span>到期管理</span>
                    </span>
                </button>
                <button class="tab-btn flex-shrink-0 whitespace-nowrap px-3 sm:px-5 py-2.5 sm:py-3 text-xs sm:text-sm font-medium text-gray-600 hover:text-blue-600 hover:bg-blue-50 rounded-t-lg" data-tab="analysis">
                    <span class="flex items-center">
                        <span class="mr-1.5 sm:mr-2 text-base sm:text-lg">📈</span>
                        <span>收益分析</span>
                    </span>
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-3 sm:px-4 py-4 sm:py-6">
        <div id="dashboard" class="tab-content active">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-4 mb-6">
                <div class="bg-white rounded-xl p-3 sm:p-4 shadow-sm">
                    <div class="text-xs sm:text-sm text-gray-500">总资产</div>
                    <div id="dashTotal" class="text-xl sm:text-2xl font-bold text-gray-800 mt-1">¥0.00</div>
                </div>
                <div class="bg-white rounded-xl p-3 sm:p-4 shadow-sm">
                    <div class="text-xs sm:text-sm text-gray-500">累计收益</div>
                    <div id="dashProfit" class="text-xl sm:text-2xl font-bold text-green-500 mt-1">¥0.00</div>
                </div>
                <div class="bg-white rounded-xl p-3 sm:p-4 shadow-sm">
                    <div class="text-xs sm:text-sm text-gray-500">年化收益率</div>
                    <div id="dashAnnual" class="text-xl sm:text-2xl font-bold text-blue-500 mt-1">0.00%</div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="bg-white rounded-xl p-4 sm:p-6 shadow-sm">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">资产分布</h3>
                    <div class="h-48 sm:h-64"><canvas id="pieChart"></canvas></div>
                </div>
                <div class="bg-white rounded-xl p-4 sm:p-6 shadow-sm">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">资产总值</h3>
                    <div class="h-48 sm:h-64"><canvas id="lineChart"></canvas></div>
                </div>
            </div>
        </div>

        <div id="assets" class="tab-content">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
                <h2 class="text-lg font-semibold text-gray-800">资产列表</h2>
                <div class="flex flex-col sm:flex-row gap-2 w-full sm:w-auto">
                    <button onclick="openSnapshotModal()" class="w-full sm:w-auto bg-green-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-green-700 whitespace-nowrap">📸 同步到月末余额表</button>
                    <button onclick="openAddModal()" class="w-full sm:w-auto bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 whitespace-nowrap">+ 添加资产</button>
                </div>
            </div>
            <div id="updateInfo" class="bg-blue-50 rounded-lg p-3 mb-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">
                <div class="flex items-center">
                    <span class="text-blue-600 mr-2">📅</span>
                    <span class="text-sm text-blue-800">
                        当前数据最后更新：<strong id="lastUpdateTime">从未更新</strong>
                    </span>
                </div>
                <div id="lastSnapshot" class="text-sm text-blue-600">
                    暂无月末快照
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm overflow-x-auto">
                <table class="w-full min-w-[768px] md:min-w-0 responsive-table">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500">名称</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500">类型</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 col-secondary">持仓数量</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 col-secondary">成本价</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 col-secondary">现价</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 col-secondary">总成本</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500">市值</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500">收益</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500">收益率</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500">操作</th>
                        </tr>
                    </thead>
                    <tbody id="assetTable"></tbody>
                </table>
            </div>
        </div>

        <div id="expiry" class="tab-content">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-gray-800">理财到期管理</h2>
                <button onclick="openExpiryModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700">+ 添加到期产品</button>
            </div>

            <div class="bg-white rounded-xl p-4 sm:p-6 shadow-sm mb-6">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">📅 到期提醒</h3>
                <div id="expiryAlert" class="space-y-3"></div>
            </div>

            <div class="bg-white rounded-xl p-4 sm:p-6 shadow-sm">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">📋 到期列表</h3>
                <div id="expiryList" class="space-y-3 max-h-96 overflow-y-auto"></div>
            </div>

            <div class="bg-white rounded-xl p-4 sm:p-6 shadow-sm mt-6">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">📊 期限分布统计</h3>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
                    <div class="bg-red-50 rounded-lg p-4 text-center">
                        <div class="text-2xl font-bold text-red-500" id="statExpired">0</div>
                        <div class="text-sm text-gray-500">已到期</div>
                    </div>
                    <div class="bg-orange-50 rounded-lg p-4 text-center">
                        <div class="text-2xl font-bold text-orange-500" id="stat7days">0</div>
                        <div class="text-sm text-gray-500">7天内到期</div>
                    </div>
                    <div class="bg-yellow-50 rounded-lg p-4 text-center">
                        <div class="text-2xl font-bold text-yellow-500" id="stat30days">0</div>
                        <div class="text-sm text-gray-500">30天内到期</div>
                    </div>
                    <div class="bg-green-50 rounded-lg p-4 text-center">
                        <div class="text-2xl font-bold text-green-500" id="statLonger">0</div>
                        <div class="text-sm text-gray-500">30天后到期</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="analysis" class="tab-content">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                <div class="bg-white rounded-xl p-4 sm:p-6 shadow-sm">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">收益率分布</h3>
                    <div class="h-40 sm:h-48"><canvas id="returnChart"></canvas></div>
                </div>
                <div class="bg-white rounded-xl p-4 sm:p-6 shadow-sm">
                    <h3 class="text-lg font-semibold text-gray-800 mb-4">分类收益占比</h3>
                    <div class="h-40 sm:h-48"><canvas id="catChart"></canvas></div>
                </div>
            </div>
            <div class="bg-white rounded-xl p-4 sm:p-6 shadow-sm mb-6">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">📊 资产总值趋势</h3>
                <div class="h-48 sm:h-64"><canvas id="lineChart2"></canvas></div>
            </div>
            <div class="bg-white rounded-xl p-4 sm:p-6 shadow-sm">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">📋 月末余额表</h3>
                <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">选择年份</label>
                        <select id="balanceYear" class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="updateSelectedMonthBalance()">
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">选择月份</label>
                        <select id="balanceMonth" class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" onchange="updateSelectedMonthBalance()">
                        </select>
                    </div>
                </div>
                <div id="monthlyDetails" class="max-h-96 overflow-y-auto"></div>
            </div>
        </div>

    </main>

    <div id="snapshotModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl w-full max-w-md mx-4">
            <div class="p-6 border-b">
                <h3 class="text-lg font-semibold text-gray-800">📸 同步到月末余额表</h3>
                <button onclick="document.getElementById('snapshotModal').classList.add('hidden')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">✕</button>
            </div>
            <div class="p-6 space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">选择年份</label>
                        <select id="snapshotYear" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">选择月份</label>
                        <select id="snapshotMonth" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </select>
                    </div>
                </div>
                <div class="bg-blue-50 rounded-lg p-4">
                    <div class="text-sm text-blue-800">
                        <div><strong>当前总资产：</strong>¥<span id="currentAssets">0</span></div>
                        <div><strong>当前总收益：</strong>¥<span id="currentProfit">0</span></div>
                    </div>
                </div>
                <div class="flex gap-3 pt-4">
                    <button onclick="document.getElementById('snapshotModal').classList.add('hidden')" class="flex-1 px-4 py-2 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50">取消</button>
                    <button onclick="saveSelectedMonthSnapshot()" class="flex-1 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">确认同步</button>
                </div>
            </div>
        </div>
    </div>

    <div id="addModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl w-full max-w-full sm:max-w-2xl mx-4 max-h-[85vh] sm:max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b">
                <h3 id="modalTitle" class="text-lg font-semibold text-gray-800">添加资产</h3>
                <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">✕</button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="editId">
                <div>
                    <label class="block text-sm font-medium text-gray-700">资产名称</label>
                    <input type="text" id="name" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">资产类型</label>
                    <select id="type" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="stock">股票</option>
                        <option value="fund">基金</option>
                        <option value="gold">黄金</option>
                        <option value="savings">银行活期</option>
                        <option value="wealth">银行理财</option>
                        <option value="housing">公积金</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">持仓数量（股/份/克）</label>
                    <input type="number" step="0.01" id="quantity" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="直接填金额时留空">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">成本价（元/股/份/克）</label>
                    <input type="number" step="0.01" id="costPrice" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="直接填金额时留空">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">现价（元/股/份/克）</label>
                    <input type="number" step="0.01" id="currentPrice" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="直接填金额时留空">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">总成本（元）</label>
                    <input type="number" step="0.01" id="totalCost" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="自动计算或手动录入">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">直接填写市值（元）</label>
                    <input type="number" id="amount" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="不填数量和价格时使用">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">到期日期</label>
                    <input type="date" id="expiryDate" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            <div class="p-6 border-t flex justify-end gap-3">
                <button onclick="closeModal()" class="px-4 py-2 border border-gray-300 rounded-lg">取消</button>
                <button id="saveBtn" onclick="saveAsset()" class="px-4 py-2 bg-blue-600 text-white rounded-lg">保存</button>
            </div>
        </div>
    </div>

    <div id="expiryModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl w-full max-w-lg mx-4">
            <div class="p-6 border-b">
                <h3 class="text-lg font-semibold text-gray-800">添加到期产品</h3>
                <button onclick="closeExpiryModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">✕</button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">产品名称</label>
                    <input type="text" id="expiryName" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">金额（元）</label>
                    <input type="number" id="expiryAmount" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">到期日期</label>
                    <input type="date" id="expiryDateInput" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">产品类型</label>
                    <select id="expiryType" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="wealth">银行理财</option>
                        <option value="fund">基金</option>
                        <option value="stock">股票</option>
                        <option value="gold">黄金</option>
                        <option value="other">其他</option>
                    </select>
                </div>
            </div>
            <div class="p-6 border-t flex justify-end gap-3">
                <button onclick="closeExpiryModal()" class="px-4 py-2 border border-gray-300 rounded-lg">取消</button>
                <button onclick="saveExpiry()" class="px-4 py-2 bg-blue-600 text-white rounded-lg">保存</button>
            </div>
        </div>
    </div>

    <script>
        let assets = [
            { id: '1', name: '招商银行活期', type: 'savings', quantity: null, costPrice: null, currentPrice: null, marketValue: 50000, expiryDate: '' },
            { id: '2', name: '易方达蓝筹', type: 'fund', quantity: 2000, costPrice: 14.20, currentPrice: 15.00, marketValue: 30000, expiryDate: '' },
            { id: '3', name: '贵州茅台', type: 'stock', quantity: 100, costPrice: 1800, currentPrice: 2000, marketValue: 200000, expiryDate: '' },
            { id: '4', name: '积存金', type: 'gold', quantity: 20, costPrice: 3800, currentPrice: 4000, marketValue: 80000, expiryDate: '' },
            { id: '5', name: '建行理财', type: 'wealth', quantity: 100, costPrice: 1000, currentPrice: 1038, marketValue: 103800, expiryDate: '2024-09-01' },
            { id: '6', name: '公积金', type: 'housing', quantity: null, costPrice: null, currentPrice: null, marketValue: 150000, expiryDate: '' },
            { id: '7', name: '短期理财', type: 'wealth', quantity: 50, costPrice: 1000, currentPrice: 1025, marketValue: 51250, expiryDate: '2026-05-07' }
        ];

        const assetTypeNames = {

        function getTotalAssetsData() {
            if (monthlySnapshots.length === 0) {
                const now = new Date();
                const currentMonth = now.getMonth() + 1;
                
                const totalAssets = assets.reduce((sum, a) => sum + a.marketValue, 0);
                
                const monthlyFactors = [1.0, 1.02, 0.98, 1.03, 0.99, 1.01, 0.97, 1.02, 0.98, 1.01, 0.99, 1.02];
                
                const data = [];
                let baseValue = totalAssets;
                for (let i = currentMonth - 1; i >= 0; i--) {
                    const monthNum = String(i + 1).padStart(2, '0');
                    baseValue = Math.round(baseValue / monthlyFactors[i]);
                    data.unshift({
                        date: monthNum + '月',
                        value: baseValue
                    });
                }
                
                return data;
            }
            
            const sortedSnapshots = [...monthlySnapshots].sort((a, b) => a.month.localeCompare(b.month));
            const data = [];
            
            sortedSnapshots.forEach(snapshot => {
                const monthName = snapshot.month.split('-')[1] + '月';
                data.push({
                    date: monthName,
                    value: snapshot.totalAssets
                });
            });
            
            return data;
        }
        
        function getProfitData() {
            const now = new Date();
            const currentMonth = now.getMonth() + 1;
            
            const totalProfit = assets.reduce((sum, asset) => {
                const cost = asset.totalCost || (asset.quantity * (asset.costPrice || 0));
                return sum + (asset.marketValue - cost);
            }, 0);
            
            if (monthlySnapshots.length >= 2) {
                const sortedSnapshots = [...monthlySnapshots].sort((a, b) => a.month.localeCompare(b.month));
                const data = [];
                
                for (let i = 1; i < sortedSnapshots.length; i++) {
                    const prev = sortedSnapshots[i - 1];
                    const curr = sortedSnapshots[i];
                    const monthName = curr.month.split('-')[1] + '月';
                    const monthlyProfit = curr.profit - prev.profit;
                    
                    data.push({
                        date: monthName,
                        profit: monthlyProfit
                    });
                }
                
                return data;
            }
            
            const monthlyBase = totalProfit / currentMonth;
            const monthlyFactors = [1.0, 0.9, 1.2, 0.85, 1.1, 0.95, 0.8, 1.15, 0.92, 1.05, 0.88, 1.12];
            
            const data = [];
            for (let i = 0; i < currentMonth; i++) {
                const monthNum = String(i + 1).padStart(2, '0');
                const profit = Math.round(monthlyBase * monthlyFactors[i]);
                data.push({
                    date: monthNum + '月',
                    profit: Math.max(-1000, profit)
                });
            }
            
            return data;
        }

                    if (diffDays < 0) {

                }
                return s.month === `${year}-${String(prevMonth).padStart(2, '0')}`;
            });
            
            const assetsChange = prevSnapshot ? (snapshot.totalAssets - prevSnapshot.totalAssets) : 0;
            const profitChange = prevSnapshot ? (snapshot.profit - prevSnapshot.profit) : 0;
            
            const snapshotAssets = snapshot.assets || [];
            const totalCost = snapshotAssets.reduce((sum, a) => sum + (a.totalCost || (a.quantity * (a.costPrice || 0))), 0);
            
            const assetRows = snapshotAssets.map(asset => {
                const assetCost = asset.totalCost || (asset.quantity * (asset.costPrice || 0));
                const typeName = assetTypeNames[asset.type] || asset.type;
                return `

                        <td class="py-3 px-4" data-label="名称">${asset.name}</td>
                        <td class="py-3 px-4" data-label="类型">${typeName}</td>
                        <td class="py-3 px-4 text-right" data-label="总成本">${assetCost > 0 ? '¥' + assetCost.toLocaleString() : '-'}</td>
                        <td class="py-3 px-4 text-right font-medium" data-label="市值">${asset.marketValue > 0 ? '¥' + asset.marketValue.toLocaleString() : '-'}</td>
                    </tr>
                `;
            }).join('');
            
            document.getElementById('monthlyDetails').innerHTML = `
                <div class="mb-4">
                    <div class="flex items-center justify-between mb-3">
                        <div>
                            <div class="font-medium text-lg">${snapshot.month}</div>
                            <div class="text-sm text-gray-500">记录于 ${new Date(snapshot.date).toLocaleDateString()}</div>
                        </div>
                        <div class="text-right text-sm">
                            <div>
                                <span class="text-gray-500">资产变化:</span>
                                <span style="color: ${assetsChange >= 0 ? '#10B981' : '#EF4444'}"> ${assetsChange >= 0 ? '+' : ''}¥${assetsChange.toLocaleString()}</span>
                            </div>
                            <div>
                                <span class="text-gray-500">收益变化:</span>
                                <span style="color: ${profitChange >= 0 ? '#10B981' : '#EF4444'}"> ${profitChange >= 0 ? '+' : ''}¥${profitChange.toLocaleString()}</span>
                            </div>
                        </div>
                    </div>
                    <table class="w-full text-sm min-w-[600px] md:min-w-0 responsive-table">
                        <thead>
                            <tr class="bg-gray-50">
                                <th class="text-left py-2 px-4 font-medium text-gray-700">名称</th>
                                <th class="text-left py-2 px-4 font-medium text-gray-700">类型</th>
                                <th class="text-right py-2 px-4 font-medium text-gray-700">总成本</th>
                                <th class="text-right py-2 px-4 font-medium text-gray-700">市值</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${assetRows}
                            <tr class="bg-gray-50 font-medium">
                                <td class="py-3 px-4" data-label="名称">合计</td>
                                <td class="py-3 px-4" data-label="类型">${snapshotAssets.length}项资产</td>
                                <td class="py-3 px-4 text-right text-blue-600" data-label="总成本">¥${totalCost.toLocaleString()}</td>
                                <td class="py-3 px-4 text-right text-blue-600" data-label="市值">¥${snapshot.totalAssets.toLocaleString()}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            `;
        }

        function refreshAll() {
            updateDashboard();
            updateAssetTable();
            updateExpirySection();
            updateCharts();
            updateMonthlyDetails();
            updateUpdateInfo();
        }
        
        function updateUpdateInfo() {
            const lastUpdateTime = document.getElementById('lastUpdateTime');
            const lastSnapshot = document.getElementById('lastSnapshot');
            
            if (lastUpdateTime) {
                lastUpdateTime.textContent = localStorage.getItem('lastUpdateTime') || '从未更新';
            }
            
            if (lastSnapshot) {
                if (monthlySnapshots.length > 0) {
                    const sortedSnapshots = [...monthlySnapshots].sort((a, b) => b.month.localeCompare(a.month));
                    lastSnapshot.textContent = `最近月末快照：${sortedSnapshots[0].month}`;
                } else {
                    lastSnapshot.textContent = '暂无月末快照';
                }
            }
        }

        function deleteAsset(id) {
            const asset = assets.find(a => a.id === id);
            if (!asset) return;
            
            if (confirm(`确定要删除「${asset.name}」吗？`)) {
                assets = assets.filter(a => a.id !== id);
                localStorage.setItem('lastUpdateTime', new Date().toLocaleString('zh-CN'));
                refreshAll();
                alert('资产已删除！');
            }
        }

        function openAddModal() { 
            document.getElementById('addModal').classList.remove('hidden');
            document.getElementById('modalTitle').textContent = '添加资产';
            document.getElementById('saveBtn').textContent = '保存';
            document.getElementById('editId').value = '';
            ['name', 'type', 'quantity', 'costPrice', 'currentPrice', 'amount', 'expiryDate'].forEach(id => document.getElementById(id).value = '');
        }

        function editAsset(id) {
            const asset = assets.find(a => a.id === id);
            if (!asset) return;
            
            document.getElementById('addModal').classList.remove('hidden');
            document.getElementById('modalTitle').textContent = '编辑资产';
            document.getElementById('saveBtn').textContent = '更新';
            document.getElementById('editId').value = id;
            
            document.getElementById('name').value = asset.name;
            document.getElementById('type').value = asset.type;
            document.getElementById('quantity').value = asset.quantity || '';
            document.getElementById('costPrice').value = asset.costPrice || '';
            document.getElementById('currentPrice').value = asset.currentPrice || '';
            const totalCost = asset.quantity && asset.costPrice ? (asset.quantity * asset.costPrice) : '';
            document.getElementById('totalCost').value = totalCost;
            document.getElementById('amount').value = '';
            document.getElementById('expiryDate').value = asset.expiryDate || '';
        }
        
        function closeModal() { 
            document.getElementById('addModal').classList.add('hidden');
        }

        function openExpiryModal() { 
            document.getElementById('expiryModal').classList.remove('hidden');
            ['expiryName', 'expiryAmount', 'expiryDateInput', 'expiryType'].forEach(id => document.getElementById(id).value = '');
        }
        
        function closeExpiryModal() { 
            document.getElementById('expiryModal').classList.add('hidden');
        }

        function saveExpiry() {
            const name = document.getElementById('expiryName').value;
            const amount = parseFloat(document.getElementById('expiryAmount').value);
            const expiryDate = document.getElementById('expiryDateInput').value;
            const type = document.getElementById('expiryType').value;
            
            if (!name || !amount || amount <= 0 || !expiryDate) {
                alert('请填写完整信息');
                return;
            }

            const newAsset = {
                id: Date.now().toString(),
                name,
                type: type === 'other' ? 'wealth' : type,
                quantity: null,
                costPrice: null,
                currentPrice: null,
                marketValue: amount,
                expiryDate
            };

            assets.push(newAsset);
            refreshAll();
            closeExpiryModal();
            alert('到期产品添加成功！');
        }

        function saveAsset() {
            const name = document.getElementById('name').value;
            const type = document.getElementById('type').value;
            const quantity = parseFloat(document.getElementById('quantity').value);
            const costPrice = parseFloat(document.getElementById('costPrice').value);
            const currentPrice = parseFloat(document.getElementById('currentPrice').value);
            const totalCost = parseFloat(document.getElementById('totalCost').value);
            const amount = parseFloat(document.getElementById('amount').value);
            const expiryDate = document.getElementById('expiryDate').value;
            
            if (!name) {
                alert('请填写资产名称');
                return;
            }

            let marketValue = 0;
            let finalCostPrice = costPrice;
            
            if (quantity && currentPrice) {
                marketValue = quantity * currentPrice;
            } else if (amount && amount > 0) {
                marketValue = amount;
            } else {
                alert('请填写数量+现价，或者直接填写市值');
                return;
            }

            if (totalCost && quantity) {
                finalCostPrice = totalCost / quantity;
            }

            const editId = document.getElementById('editId').value;
            
            if (editId) {
                const index = assets.findIndex(a => a.id === editId);
                if (index !== -1) {
                    assets[index] = {
                        id: editId,
                        name,
                        type,
                        quantity: quantity || null,
                        costPrice: finalCostPrice || null,
                        currentPrice: currentPrice || null,
                        marketValue,
                        expiryDate,
                        totalCost: totalCost || null
                    };
                }
            } else {
                const newAsset = {
                    id: Date.now().toString(),
                    name,
                    type,
                    quantity: quantity || null,
                    costPrice: finalCostPrice || null,
                    currentPrice: currentPrice || null,
                    marketValue,
                    expiryDate,
                    totalCost: totalCost || null
                };
                assets.push(newAsset);
            }
            
            localStorage.setItem('lastUpdateTime', new Date().toLocaleString('zh-CN'));
            refreshAll();
            closeModal();
            alert(editId ? '资产更新成功！' : '资产添加成功！');
        }

        function calculateTotalCost() {
            const totalCostInput = document.getElementById('totalCost');
            if (totalCostInput.dataset.manual === 'true') return;
            const quantity = parseFloat(document.getElementById('quantity').value) || 0;
            const costPrice = parseFloat(document.getElementById('costPrice').value) || 0;
            const totalCost = quantity * costPrice;
            totalCostInput.value = totalCost > 0 ? totalCost.toFixed(2) : '';
        }

        document.getElementById('totalCost').addEventListener('input', () => {
            const totalCostInput = document.getElementById('totalCost');
            totalCostInput.dataset.manual = totalCostInput.value ? 'true' : 'false';
        });

        document.getElementById('quantity').addEventListener('input', calculateTotalCost);
        document.getElementById('costPrice').addEventListener('input', calculateTotalCost);

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('active', 'text-white', 'bg-gradient-to-r', 'from-blue-500', 'to-blue-600', 'shadow-md');
                    b.classList.add('text-gray-600', 'hover:text-blue-600', 'hover:bg-blue-50');
                });
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.remove('text-gray-600', 'hover:text-blue-600', 'hover:bg-blue-50');
                btn.classList.add('active', 'text-white', 'bg-gradient-to-r', 'from-blue-500', 'to-blue-600', 'shadow-md');
                document.getElementById(btn.dataset.tab).classList.add('active');
                
                refreshAll();
            });
        });

        refreshAll();

        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE = 'asset-mgr-v1';
                self.addEventListener('install', e => {
                    e.waitUntil(caches.open(CACHE).then(c => c.addAll([self.location.href])));
                    self.skipWaiting();
                });
                self.addEventListener('activate', e => {
                    e.waitUntil(caches.keys().then(keys => Promise.all(
                        keys.filter(k => k !== CACHE).map(k => caches.delete(k))
                    )));
                    self.clients.claim();
                });
                self.addEventListener('fetch', e => {
                    e.respondWith(
                        caches.match(e.request).then(r => r || fetch(e.request).then(resp => {
                            if (resp.ok && resp.type === 'basic') {
                                const clone = resp.clone();
                                caches.open(CACHE).then(c => c.put(e.request, clone));
                            }
                            return resp;
                        }))
                    );
                });
            `;
            const blob = new Blob([swCode], { type: 'text/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob))
                .then(() => console.log('PWA: Service Worker 注册成功，支持离线使用'))
                .catch(() => console.log('PWA: Service Worker 注册失败'));
        }
    </script>
</body>
</html>
